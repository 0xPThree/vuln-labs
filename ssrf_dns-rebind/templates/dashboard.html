<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="static/css/style.css">
</head>
<body class="dark-body">
    <!-- Navbar at the top of the page -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Dashboard</a>
                    </li>
                </ul>
                <ul class="navbar-nav ml-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main content, with some margin at the top to prevent the navbar from overlapping -->
    <div class="container mt-5 pt-5">
        <!-- Heading -->
        <h3 class="text-center text-white mt-5 mb-4">Your Files</h3>

        <!-- Files List -->
        <div id="files-container" class="mb-5">
            <!-- Dynamic files will be populated here -->
        </div>

        <!-- File Upload Form -->
        <form class="row g-3 align-items-center container mb-5" method="POST" action="/api/v3/upload">
            <div class="col-12 col-md-10 mb-2">
                <label for="inputUrl" class="visually-hidden">File URL</label>
                <input type="text" class="form-control input-dark" name="file_url" id="inputUrl" placeholder="File URL" required>
            </div>
            <div class="col-12 col-md-2 mb-2 d-grid">
                <button type="submit" class="btn btn-accent">Upload</button>
            </div>
        </form>
    </div>

    <script src="static/js/main.js"></script>
</body>
</html>
