services:
  app:
    container_name: node-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:3000"
    depends_on:
      - redis-server
      - mysql_database
    restart: always

  redis-server:
    container_name: redis-cache
    image: redis:latest
    ports:
      - "6379:6379"
    restart: always

  mysql_database:
    container_name: mysqlDB
    build: ./db
    ports:
      - "3306:3306"
    restart: always
